# =============================================================================
# Docker Compose for Bancada
# Supports both development and production modes
# =============================================================================

services:
  # ===========================================================================
  # Development Service
  # Hot-reload enabled for local development
  # ===========================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NODE_VERSION: 22.13.1
        PNPM_VERSION: 9.12.3
    container_name: bancada-dev
    image: bancada:dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Use named volume for node_modules to avoid conflicts with host
      - node_modules:/app/node_modules
      # Mount pnpm store for faster installs
      - pnpm_store:/app/.pnpm-store
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - bancada-network
    # Keep container running and enable tty for better logging
    tty: true
    stdin_open: true
    # Restart on failure
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.bancada.service=dev"
      - "com.bancada.environment=development"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Production Service
  # Uses multi-stage build with nginx for serving static files
  # ===========================================================================
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NODE_VERSION: 22.13.1
        PNPM_VERSION: 9.12.3
    container_name: bancada-prod
    image: bancada:prod
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    networks:
      - bancada-network
    # Restart policy for production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.bancada.service=prod"
      - "com.bancada.environment=production"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bancada-network:
    name: bancada-network
    driver: bridge

volumes:
  node_modules:
    name: bancada-node-modules
  pnpm_store:
    name: bancada-pnpm-store
